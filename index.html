<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golf Vector Field</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Golf Vector Field</h1>

  <div id="game-container">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="win-overlay" class="hidden">
      <div class="win-content">
        <h2 id="win-title">You Win!</h2>
        <p>Hole <span id="win-hole-value">1</span>/<span id="win-hole-total">3</span> - Attempts this hole: <span id="win-attempts-value">0</span>, Total: <span id="win-total-value">0</span></p>
        <p>Press R to Continue</p>
      </div>
    </div>
  </div>

  <div id="hotbar">
    <div class="hotbar-slot selected" data-type="amplify" title="Amplify x5 (1)"><span class="hotbar-icon">»</span><span class="hotbar-label">Amplify x5</span><span class="hotbar-key">1</span></div>
    <div class="hotbar-slot" data-type="nullify" title="Nullify (2)"><span class="hotbar-icon">∅</span><span class="hotbar-label">Nullify</span><span class="hotbar-key">2</span></div>
    <div class="hotbar-slot" data-type="flip" title="Flip (3)"><span class="hotbar-icon">↻</span><span class="hotbar-label">Flip</span><span class="hotbar-key">3</span></div>
  </div>

  <div id="instructions">
    <p><strong>Arrows</strong>: Aim &nbsp;|&nbsp; <strong>Space</strong>: Shoot &nbsp;|&nbsp; <strong>R</strong>: Reset &nbsp;|&nbsp; <strong>H</strong>: Toggle Wind &nbsp;|&nbsp; <strong>Click</strong>: Place Modifier &nbsp;|&nbsp; <strong>Right-Click</strong>: Remove</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
